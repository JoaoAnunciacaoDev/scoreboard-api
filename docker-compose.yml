services:
  postgres:
    image: postgres:16
    container_name: scoreboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: scoreboard
      POSTGRES_DB: scoreboard
    ports:
      - "5432:5432"
    volumes:
      - scoreboard_pgdata:/var/lib/postgresql/data

volumes:
  scoreboard_pgdata: